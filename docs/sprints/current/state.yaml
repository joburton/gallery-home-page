    shuffled: true
    seed: 4271
    method: "dynamic tiles permuted, static tiles hold their index (bin/shuffle-tiles)"
    monotony_score: "99 -> 0 (adjacent duplicate subjects, clustered 2x2, runs of one contentType)"
    note: "one-off data reorder, NOT the Phase 2 periodic auto-shuffle"
  tile_mix: {total: 32, "2x2": 8, "1x1": 24, ratio: "one quarter 2x2"}
  fonts: {loaded: "NeueMontreal-Medium.woff2 (31KB, swap + preload)", missing: "NeueMontreal-Light", supplied_unused: "MessinaModern"}
  grid_measured_in_chrome:
    two_column_floor_at_320px: "holds at gutter 0,1,4,8,16,32,64"
    column_reflow: "2,2,2,3,3,5,7,9 across 320-1920px, no breakpoint jump"
    horizontal_overflow: none
    tiles_square: "1x1 and 2x2 square at every width tested"
    two_by_two_geometry: "exactly 2 columns + 1 gutter"
  transcode:
    source: "1920x1080, 2.4s, 20Mbps, 6,041,498 bytes, no audio stream"
    output: "768x768 muted, 87,916 bytes (1.5% of source)"

bugs_found_and_fixed:
  - "grid-column shorthand resolved to grid-column-START: span 2, which the welcome
     tile's pinning rule then overrode — silently collapsing a 2x2 to one column.
     Fixed by declaring spans with the -end longhand."
  - "Narrow-width text-tile rule lost on specificity to the tile-size rule, so the
     tile went full-width but stayed square. Fixed by raising selector specificity."
  - "fetchpriority was keyed to loop.first, which is the welcome TEXT tile — so no
     image was ever prioritised. Now keyed to the first tile that has media."
  - "Primary CTA was white on Sabin orange: 3.34:1, failing WCAG AA. Now dark-gray at
     the large-text size floor, 3.96:1."
  - "STDERR resolved into the Sabin\\Harness namespace, fataling the dev router. The
     fatal returned HTTP 200, so a status-code check missed it entirely."

