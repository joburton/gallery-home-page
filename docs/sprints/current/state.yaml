    cls: 0
    total_blocking_time_ms: 0
  initial_viewport_budget:
    # First-viewport cost only — reproducible. "Images the browser opportunistically
    # prefetches" is not a stable property; Chrome sizes its own lazy threshold.
    mobile_390x844: {kb: 141.8, note: "identical across 3 runs; 4 tiles in fold"}
    desktop_1440x900: {kb: 204.2, note: "25 tiles in fold"}
    depth_invariance: "image bytes plateau at the unique-tile count regardless of minCanvasDepth"
